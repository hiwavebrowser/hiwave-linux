name: Linux Metrics

# hiwave-linux had NO workflows at all -- zero CI, zero collected metrics,
# no metrics-history branch -- while hiwave-macos has collected parity metrics
# on every push for months and hiwave-windows gained a metrics job tonight.
# This is the Linux counterpart, copied from Athena's hiwave-windows collector
# rather than re-derived.
#
# It deliberately does NOT port hiwave-macos's parity pixel-diff metric.
# That harness needs a real GPU adapter, and when capture yields nothing it
# defaults each case to 100.0 rather than erroring, so a hosted GPU-less runner
# would publish a confident-looking "100% diff" that measures the runner, not
# the renderer -- the exact class of defect hiwave-macos PR #65 spent a night
# removing. Build and test results are what a headless Linux box can honestly
# report, so those are what this collects. If Linux CI ever gets a GPU runner,
# wire the pixel-diff then and not before.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: never

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux-only: the workspace needs GTK + WebKitGTK (wry/tao webview),
      # Fontconfig + FreeType (rustkit-text) to compile. macOS/Windows get
      # these from their system SDKs; a bare ubuntu runner does not.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libssl-dev \
            libasound2-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            fonts-dejavu-core \
            fonts-liberation \
            mesa-vulkan-drivers \
            libvulkan1 \
            vulkan-tools

      - name: Collect metrics
        shell: bash
        run: |
          python scripts/collect_metrics.py \
            --output metrics.json \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}"

      - name: Job summary
        shell: bash
        run: |
          python scripts/collect_metrics.py \
            --input metrics.json --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-metrics-${{ github.sha }}
          path: metrics.json
          retention-days: 90

      # Fail the job AFTER the metrics are recorded, so a red build still
      # produces a data point instead of losing the run entirely.
      - name: Enforce build and tests
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("metrics.json", encoding="utf-8"))
          bad = []
          if not m["build"]["ok"]:
              bad.append(f"build exit {m['build']['exit_code']}")
          if m["tests"]["failed"]:
              bad.append(f"{m['tests']['failed']} test(s) failed")
          if bad:
              print("FAIL: " + "; ".join(bad))
              sys.exit(1)
          print(f"OK: {m['tests']['passed']} tests passed")
          PY

      # Runs on EVERY branch so the logic is actually exercised in review; only
      # the final push is master-gated. (= Athena's Windows #44 class fix: a
      # step gated entirely to master can never execute in PR review, so it is
      # unreviewable by construction — hers shipped broken and went red on its
      # first real master run.)
      - name: Update metrics history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep the metrics file across the branch switch, then REMOVE it from
          # the working tree. It is untracked here but TRACKED on
          # metrics-history, so leaving it in place makes `git checkout
          # metrics-history` refuse ("untracked working tree files would be
          # overwritten"). `git checkout -- .` does not help: it only discards
          # modifications to TRACKED files. (= Windows #44 instance fix.)
          cp metrics.json "$RUNNER_TEMP/metrics.json"
          rm -f metrics.json
          git checkout -- .

          # Point the local branch at the remote if it exists, else start an
          # orphan. `checkout -B <b> origin/<b>` is idempotent and cannot trip
          # the "already exists" error the previous fetch-then-checkout could.
          if git fetch origin metrics-history 2>/dev/null; then
            git checkout -B metrics-history origin/metrics-history
          else
            git checkout --orphan metrics-history
            # --orphan keeps the working tree staged; start the branch empty.
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p metrics
          cp "$RUNNER_TEMP/metrics.json" metrics.json
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          cp metrics.json "metrics/${TIMESTAMP}_${{ github.sha }}.json"

          python - <<'PY'
          import csv, json, os
          m = json.load(open("metrics.json", encoding="utf-8"))
          path = "metrics/history.csv"
          exists = os.path.exists(path)
          with open(path, "a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              if not exists:
                  w.writerow(["timestamp", "commit", "branch", "build_ok",
                              "passed", "failed", "ignored", "warnings"])
              w.writerow([
                  m["timestamp"], m["commit"][:8], m["branch"],
                  m["build"]["ok"], m["tests"]["passed"], m["tests"]["failed"],
                  m["tests"]["ignored"], m["build"]["warnings"],
              ])
          PY

          git add metrics/ metrics.json
          git commit -m "Add Linux metrics for ${{ github.sha }}" \
            || echo "No changes to commit"

          # Only master publishes. On a PR branch everything above has already
          # run — checkout, history append, commit — so a breakage surfaces in
          # review; the commit is simply discarded with the runner.
          #
          # DIVERGENCE from Windows #44 (deliberate, documented): the push has
          # NO `|| echo` fallback. Atlas found that pattern on hiwave-macos and
          # recorded it on BOARD as a decorative-green defect — a failed push
          # printed a line and the step stayed GREEN, silently ending metrics
          # collection. Pete's "no result should be decorative" ruling applies:
          # if master cannot publish history, this step must go RED.
          if [ "${{ github.ref }}" = "refs/heads/master" ] \
            || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git push origin metrics-history
          else
            echo "Not master — history logic exercised, push skipped."
          fi
