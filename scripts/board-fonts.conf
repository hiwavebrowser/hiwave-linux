<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- One fontconfig set for BOTH arms of the Linux chrome board (Chrome for Testing and RustKit's fontconfig crate both read FONTCONFIG_FILE).
     The system config stays the base; the generics are pinned to named families and hinting/anti-aliasing are fixed, so a Linux
     geometry diff is not font substitution that drifts with the host's default font. The resolved families are recorded in the board JSON. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family" qual="any"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
