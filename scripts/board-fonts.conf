<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- One fontconfig set for BOTH arms of the Linux chrome board (Chrome for Testing and RustKit's fontconfig crate both read FONTCONFIG_FILE).
     The system config stays the base and hinting/anti-aliasing are fixed, so a Linux geometry diff is not rendering that drifts with
     the host. The generic pins below are what fontconfig answers (and what board.json records with fc-match), NOT what either arm
     draws for every generic: Chrome 148 on Linux takes sans-serif and serif from its own default fonts (Arial and Times New Roman,
     i.e. Liberation Sans and Liberation Serif), and RustKit matches it (measured 2026-11-19 with CSS.getPlatformFontsForNode).
     In practice these pins decide system-ui (Noto Sans) and monospace (DejaVu Sans Mono). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family" qual="any"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>serif</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
